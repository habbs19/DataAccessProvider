name: Publish NuGet packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  ARTIFACTS_DIR: ./artifacts

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore DataAccessProvider.sln

      - name: Build solution
        run: dotnet build DataAccessProvider.sln --configuration Release --no-restore

      - name: Pack NuGet packages
        run: |
          dotnet pack DataAccessProvider.Core/DataAccessProvider.Core.csproj --configuration Release --no-build --output "${{ env.ARTIFACTS_DIR }}"
          dotnet pack DataAccessProvider.MSSQL/DataAccessProvider.MSSQL.csproj --configuration Release --no-build --output "${{ env.ARTIFACTS_DIR }}"
          dotnet pack DataAccessProvider.MySql/DataAccessProvider.MySql.csproj --configuration Release --no-build --output "${{ env.ARTIFACTS_DIR }}"
          dotnet pack DataAccessProvider.Postgres/DataAccessProvider.Postgres.csproj --configuration Release --no-build --output "${{ env.ARTIFACTS_DIR }}"
          dotnet pack DataAccessProvider.MongoDB/DataAccessProvider.MongoDB.csproj --configuration Release --no-build --output "${{ env.ARTIFACTS_DIR }}"

      - name: Log in to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to NuGet.org
        run: dotnet nuget push "${{ env.ARTIFACTS_DIR }}/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "${{ env.NUGET_SOURCE }}" --skip-duplicate
